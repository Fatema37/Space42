name: API security tests
run-name: "${{ github.workflow }} — make ${{ inputs.suite || 'test' }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:                 # "Run workflow" button in the Actions tab
    inputs:
      suite:
        description: "Which part to run (a make target)"
        type: choice
        default: test
        options: [test, auth, users, matrix, exposure, findings, contract]
      verbose:
        description: "Print every request and response in the log"
        type: boolean
        default: false

# Never run two suites at the same time against the shared public API.
concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Extra pytest options; only set when the manual run asked for verbose logging.
      PYTEST_ADDOPTS: ${{ inputs.verbose == true && '-o log_cli=true' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The same commands the README documents.
      - name: Install
        run: make install

      - name: Run (make ${{ inputs.suite || 'test' }})
        run: |
          set -o pipefail
          make ${{ inputs.suite || 'test' }} | tee run.log

      # Headline counts + the findings table on the run's summary page (even if it failed).
      - name: Publish results to the job summary
        if: always()
        run: |
          {
            echo "## API security tests"
            echo
            grep -E "^contract checks passed:" run.log | tail -1 \
              | sed -E 's/^(contract checks passed: [0-9]+).*(findings: [0-9]+).*/**\1 · \2** — findings are expected `xfail`s (documented gaps a secure API would not have), not test failures./' \
              || echo "_run did not produce a summary_"
            echo
            echo "### Findings"
            echo
            cat reports/findings.md 2>/dev/null || echo "_no findings file produced_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/
            logs/
