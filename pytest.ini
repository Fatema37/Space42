[pytest]
testpaths = tests

markers =
    auth: authentication and token/session handling
    users: user directory read / write contract
    rbac: role-based authorization matrix
    ownership: cross-user resource access
    exposure: sensitive-data / field-level exposure
    contract: asserts DummyJSON's real documented behaviour (expected PASS)
    security_hypothesis: asserts secure production behaviour (expected XFAIL = documented finding)
    negative: invalid / boundary / error inputs
    severity(level): finding severity for the report — high / medium / low
    owasp(category): OWASP API Security Top 10 (2023) category, e.g. API1 / API3

addopts =
    -rsfE
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml

# A strict xfail that PASSES fails the run — this is how "DummyJSON silently added RBAC" alerts us.
xfail_strict = true

# pytest's own logging: captured per test (shown in the HTML report) + a file per run.
# Live console output is off so the security summary stays readable; enable with -o log_cli=true.
log_cli = false
log_cli_level = INFO
log_file = logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(message)s
